<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genetic Circuit Game - iGEM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }
        #canvas-container {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <script>
        // Game state
        let score = 0;               // Current score
        let gameTime = 60;           // Time limit (seconds)
        let timeLeft = gameTime;     // Time remaining
        let startTime;               // Game start time
        let gameOver = false;        // Game over flag
        let rankingSaved = false;    // Whether the ranking has been saved
        
        // Ranking data
        let rankings = [];           // Stores the top 3 scores
        
        // Player (petri dish)
        let player;
        
        // Array of falling parts
        let fallingParts = [];
        let spawnInterval = 60;      // Part spawn interval (frames)
        let frameCounter = 0;
        
        // Combo system
        let comboSequence = ['P', 'R', 'G', 'T'];  // Correct order
        let currentCombo = [];                      // Current combo progress
        let comboMessage = '';                      // Combo message
        let comboMessageTimer = 0;                  // Message display time
        let glowTimer = 0;                          // Petri dish glow effect timer
        
        // Part type definitions
        const partTypes = {
            P: { name: 'Promoter', color: [255, 50, 50], shape: 'square', points: 10 },
            R: { name: 'RBS', color: [255, 200, 0], shape: 'circle', points: 10 },
            G: { name: 'Gene/GFP', color: [50, 255, 100], shape: 'capsule', points: 30 },
            T: { name: 'Terminator', color: [50, 100, 255], shape: 'tshape', points: 10 },
            X: { name: 'Antibiotics', color: [138, 43, 226], shape: 'spike', points: -50 }
        };
        
        // Player class (petri dish)
        class Player {
            constructor() {
                this.width = 100;
                this.height = 20;
                this.x = 600;  // Centered
                this.y = 550;
                this.speed = 8;
                this.gameAreaLeft = 200;   // Left edge of the play area
                this.gameAreaRight = 1000; // Right edge of the play area
            }
            
            // Draw
            draw() {
                push();
                translate(this.x, this.y);
                
                // Glow effect
                if (glowTimer > 0) {
                    fill(100, 255, 100, 150);
                    noStroke();
                    ellipse(0, 0, this.width + 30, this.height + 30);
                }
                
                // Petri dish body
                fill(200, 220, 255);
                stroke(100, 140, 200);
                strokeWeight(3);
                
                // Petri dish shape (ellipse)
                ellipse(0, 0, this.width, this.height);
                
                // Petri dish lid (top line)
                stroke(80, 120, 180);
                line(-this.width/2 + 10, 0, this.width/2 - 10, 0);
                
                pop();
            }
            
            // Movement
            update() {
                // Mouse control (inside the play area only)
                if (mouseX > this.gameAreaLeft && mouseX < this.gameAreaRight) {
                    this.x = mouseX;
                }
                
                // Keyboard control
                if (keyIsDown(LEFT_ARROW)) {
                    this.x -= this.speed;
                }
                if (keyIsDown(RIGHT_ARROW)) {
                    this.x += this.speed;
                }
                
                // Keep inside the play area
                this.x = constrain(this.x, this.gameAreaLeft + this.width/2, this.gameAreaRight - this.width/2);
            }
            
            // Collision detection
            checkCollision(part) {
                return (
                    part.x > this.x - this.width/2 &&
                    part.x < this.x + this.width/2 &&
                    part.y > this.y - this.height/2 &&
                    part.y < this.y + this.height/2
                );
            }
        }
        
        // Falling part class
        class FallingPart {
            constructor(type) {
                this.type = type;
                this.info = partTypes[type];
                this.x = random(250, 950);  // Limited to the play area (200-1000px)
                this.y = -20;
                this.size = 30;
                this.speed = random(2, 4);
                this.rotation = 0;
            }
            
            // Draw
            draw() {
                push();
                translate(this.x, this.y);
                rotate(this.rotation);
                
                fill(this.info.color);
                stroke(0);
                strokeWeight(2);
                
                // Draw according to shape
                switch(this.info.shape) {
                    case 'square':
                        rect(-this.size/2, -this.size/2, this.size, this.size);
                        break;
                    case 'circle':
                        ellipse(0, 0, this.size, this.size);
                        break;
                    case 'capsule':
                        // Capsule
                        rect(-this.size/2, -this.size/3, this.size, this.size/1.5, 15);
                        break;
                    case 'tshape':
                        // T shape
                        rect(-this.size/2, -this.size/4, this.size, this.size/4);
                        rect(-this.size/6, -this.size/4, this.size/3, this.size);
                        break;
                    case 'spike':
                        // Spiky
                        for (let i = 0; i < 8; i++) {
                            let angle = (TWO_PI / 8) * i;
                            let x1 = cos(angle) * this.size/4;
                            let y1 = sin(angle) * this.size/4;
                            let x2 = cos(angle) * this.size/2;
                            let y2 = sin(angle) * this.size/2;
                            triangle(0, 0, x1, y1, x2, y2);
                        }
                        break;
                }
                
                // Part label
                fill(255);
                noStroke();
                textAlign(CENTER, CENTER);
                textSize(14);
                textStyle(BOLD);
                text(this.type, 0, 0);
                
                pop();
            }
            
            // Update
            update() {
                this.y += this.speed;
                this.rotation += 0.05;
            }
            
            // Check whether it has left the screen
            isOffScreen() {
                return this.y > height + 50;
            }
        }
        
        // p5.js setup
        function setup() {
            let canvas = createCanvas(1200, 600);
            canvas.parent('canvas-container');
            
            // Initialize the player
            player = new Player();
            
            // Record the game start time
            startTime = millis();
            
            // Load rankings
            loadRankings();
        }
        
        // p5.js main loop
        function draw() {
            // Background
            background(20, 25, 40);
            
            // Area dividers
            stroke(100, 100, 150);
            strokeWeight(2);
            line(200, 0, 200, height);  // Left divider
            line(1000, 0, 1000, height); // Right divider
            
            // While the game is running
            if (!gameOver) {
                // Calculate remaining time
                timeLeft = gameTime - floor((millis() - startTime) / 1000);
                
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    gameOver = true;
                    
                    // Add to rankings (only once)
                    if (!rankingSaved) {
                        saveRanking(score);
                        rankingSaved = true;
                    }
                }
                
                // Spawn parts
                frameCounter++;
                if (frameCounter >= spawnInterval) {
                    frameCounter = 0;
                    let types = ['P', 'R', 'G', 'T', 'X'];
                    let randomType = random(types);
                    fallingParts.push(new FallingPart(randomType));
                }
                
                // Update and draw the player
                player.update();
                player.draw();
                
                // Update and draw falling parts
                for (let i = fallingParts.length - 1; i >= 0; i--) {
                    let part = fallingParts[i];
                    part.update();
                    part.draw();
                    
                    // Collision detection
                    if (player.checkCollision(part)) {
                        handleCatch(part);
                        fallingParts.splice(i, 1);
                    }
                    // Remove once off screen
                    else if (part.isOffScreen()) {
                        fallingParts.splice(i, 1);
                    }
                }
                
                // Decrease glow timer
                if (glowTimer > 0) {
                    glowTimer--;
                }
                
                // Decrease combo message timer
                if (comboMessageTimer > 0) {
                    comboMessageTimer--;
                }
                
                // Draw UI
                drawUI();
                
                // Draw score table
                drawScoreTable();
                
                // Draw rankings
                drawRankings();
                
                // Draw combo message
                if (comboMessageTimer > 0) {
                    push();
                    textAlign(CENTER, CENTER);
                    textSize(48);
                    fill(100, 255, 100);
                    stroke(255);
                    strokeWeight(4);
                    text(comboMessage, width/2, height/2);
                    pop();
                }
            } else {
                // Game over screen
                drawGameOver();
            }
        }
        
        // Handle catching a part
        function handleCatch(part) {
            // Add score
            score += part.info.points;
            
            // Check combo for anything except Antibiotics
            if (part.type !== 'X') {
                // Check whether it matches the next expected part
                let expectedPart = comboSequence[currentCombo.length];
                
                if (part.type === expectedPart) {
                    currentCombo.push(part.type);
                    
                    // Check for combo completion
                    if (currentCombo.length === comboSequence.length) {
                        score += 200;  // Bonus
                        comboMessage = 'Circuit Complete!';
                        comboMessageTimer = 120;  // Show for 2 seconds
                        glowTimer = 30;  // Glow for 0.5 seconds
                        currentCombo = [];  // Reset combo
                    }
                } else {
                    // Wrong order resets the combo
                    currentCombo = [];
                    // But if it is the first part of the combo, start a new one
                    if (part.type === comboSequence[0]) {
                        currentCombo.push(part.type);
                    }
                }
            } else {
                // Catching Antibiotics resets the combo
                currentCombo = [];
            }
        }
        
        // Draw UI
        function drawUI() {
            push();
            
            // Background panel (play area only)
            fill(0, 0, 0, 150);
            noStroke();
            rect(200, 0, 800, 80);
            
            // Score
            fill(255);
            textSize(24);
            textAlign(LEFT, TOP);
            text('Score: ' + score, 220, 15);
            
            // Time remaining
            textAlign(RIGHT, TOP);
            fill(timeLeft <= 10 ? color(255, 100, 100) : color(255));
            text('Time: ' + timeLeft + 's', 980, 15);
            
            // Hint for the next part to catch
            textAlign(LEFT, TOP);
            textSize(18);
            fill(200, 255, 200);
            text('Combo hint:', 220, 50);
            
            let hintX = 350;
            for (let i = 0; i < comboSequence.length; i++) {
                let partType = comboSequence[i];
                let partInfo = partTypes[partType];
                
                // Parts already caught are shown brightly
                if (i < currentCombo.length) {
                    fill(partInfo.color);
                    stroke(255);
                    strokeWeight(3);
                } else if (i === currentCombo.length) {
                    // Highlight the next part to catch
                    fill(partInfo.color);
                    stroke(255, 255, 0);
                    strokeWeight(3);
                } else {
                    // Parts not yet caught are faded
                    fill(partInfo.color[0], partInfo.color[1], partInfo.color[2], 100);
                    stroke(150);
                    strokeWeight(1);
                }
                
                rect(hintX, 45, 30, 30, 5);
                
                fill(255);
                noStroke();
                textAlign(CENTER, CENTER);
                textSize(16);
                text(partType, hintX + 15, 60);
                
                hintX += 40;
                
                // Draw arrow
                if (i < comboSequence.length - 1) {
                    fill(150);
                    textSize(20);
                    text('→', hintX - 20, 60);
                }
            }
            
            pop();
        }
        
        // Reset the game
        function resetGame() {
            score = 0;
            timeLeft = gameTime;
            gameOver = false;
            rankingSaved = false;
            fallingParts = [];
            currentCombo = [];
            comboMessage = '';
            comboMessageTimer = 0;
            glowTimer = 0;
            frameCounter = 0;
            player = new Player();
            startTime = millis();
        }
        
        // Game over screen
        function drawGameOver() {
            background(20, 25, 40);
            
            // Draw score table
            drawScoreTable();
            
            // Draw rankings
            drawRankings();
            
            push();
            textAlign(CENTER, CENTER);
            
            // Title (screen center)
            fill(255, 200, 100);
            textSize(48);
            textStyle(BOLD);
            text('Game Over!', 600, height/2 - 100);
            
            // Final score
            fill(100, 255, 150);
            textSize(64);
            text('Total Score: ' + score, 600, height/2);
            
            // Message
            fill(200);
            textSize(24);
            textStyle(NORMAL);
            text('Thanks for playing!', 600, height/2 + 80);
            
            // Play again button
            let buttonX = 600;
            let buttonY = height/2 + 140;
            let buttonW = 200;
            let buttonH = 50;
            
            // Button hover check
            let isHover = mouseX > buttonX - buttonW/2 && mouseX < buttonX + buttonW/2 &&
                          mouseY > buttonY - buttonH/2 && mouseY < buttonY + buttonH/2;
            
            // Draw button
            if (isHover) {
                fill(100, 255, 150);
                cursor(HAND);
            } else {
                fill(50, 200, 100);
                cursor(ARROW);
            }
            stroke(255);
            strokeWeight(3);
            rect(buttonX - buttonW/2, buttonY - buttonH/2, buttonW, buttonH, 10);
            
            fill(255);
            noStroke();
            textSize(24);
            textStyle(BOLD);
            text('Play Again', buttonX, buttonY);
            
            pop();
        }
        
        // Draw the score table
        function drawScoreTable() {
            push();
            
            // Score table panel background
            fill(0, 0, 0, 180);
            noStroke();
            rect(20, 100, 160, 380, 10);
            
            // Title
            fill(100, 200, 255);
            textSize(20);
            textStyle(BOLD);
            textAlign(CENTER, TOP);
            text('📊 Points 📊', 100, 110);
            
            // Points for each part
            textAlign(LEFT, TOP);
            textStyle(NORMAL);
            let yPos = 150;
            
            // Promoter
            fill(partTypes.P.color);
            rect(35, yPos, 25, 25, 3);
            fill(255);
            textSize(14);
            text('P', 42, yPos + 5);
            fill(200);
            textSize(12);
            text('Promoter', 70, yPos + 2);
            fill(255, 200, 100);
            textSize(16);
            text('+10', 70, yPos + 16);
            yPos += 45;
            
            // RBS
            fill(partTypes.R.color);
            ellipse(47, yPos + 12, 25, 25);
            fill(255);
            textSize(14);
            text('R', 42, yPos + 5);
            fill(200);
            textSize(12);
            text('RBS', 70, yPos + 2);
            fill(255, 200, 100);
            textSize(16);
            text('+10', 70, yPos + 16);
            yPos += 45;
            
            // Gene/GFP
            fill(partTypes.G.color);
            rect(35, yPos + 4, 25, 18, 8);
            fill(255);
            textSize(14);
            text('G', 41, yPos + 5);
            fill(200);
            textSize(12);
            text('Gene/GFP', 70, yPos + 2);
            fill(255, 200, 100);
            textSize(16);
            text('+30', 70, yPos + 16);
            yPos += 45;
            
            // Terminator
            fill(partTypes.T.color);
            rect(35, yPos + 8, 25, 4);
            rect(44, yPos + 8, 7, 18);
            fill(255);
            textSize(14);
            text('T', 43, yPos + 8);
            fill(200);
            textSize(12);
            text('Terminator', 70, yPos + 2);
            fill(255, 200, 100);
            textSize(16);
            text('+10', 70, yPos + 16);
            yPos += 45;
            
            // Antibiotics
            fill(partTypes.X.color);
            for (let i = 0; i < 8; i++) {
                let angle = (TWO_PI / 8) * i;
                let x1 = 47 + cos(angle) * 4;
                let y1 = yPos + 12 + sin(angle) * 4;
                let x2 = 47 + cos(angle) * 12;
                let y2 = yPos + 12 + sin(angle) * 12;
                triangle(47, yPos + 12, x1, y1, x2, y2);
            }
            fill(255);
            textSize(14);
            text('X', 42, yPos + 5);
            fill(200);
            textSize(12);
            text('Antibiotics', 70, yPos + 2);
            fill(255, 100, 100);
            textSize(16);
            text('-50', 70, yPos + 16);
            yPos += 55;
            
            // Combo bonus
            fill(255, 215, 0);
            textSize(16);
            textStyle(BOLD);
            textAlign(CENTER, TOP);
            text('⚡ Combo Bonus ⚡', 100, yPos + 8);
            
            fill(200);
            textSize(12);
            textStyle(NORMAL);
            text('P → R → G → T', 100, yPos + 30);
            
            fill(100, 255, 100);
            textSize(20);
            textStyle(BOLD);
            text('+200', 100, yPos + 46);
            
            pop();
        }
        
        // Load rankings
        function loadRankings() {
            let saved = sessionStorage.getItem('biobricks-rankings');
            if (saved) {
                rankings = JSON.parse(saved);
            } else {
                rankings = [];
            }
        }
        
        // Save rankings
        function saveRanking(newScore) {
            rankings.push(newScore);
            rankings.sort((a, b) => b - a);  // Sort descending
            rankings = rankings.slice(0, 3);  // Keep only the top 3
            sessionStorage.setItem('biobricks-rankings', JSON.stringify(rankings));
        }
        
        // Draw rankings
        function drawRankings() {
            push();
            
            // Ranking panel background
            fill(0, 0, 0, 180);
            noStroke();
            rect(1020, 100, 160, 200, 10);
            
            // Title
            fill(255, 215, 0);
            textSize(20);
            textStyle(BOLD);
            textAlign(CENTER, TOP);
            text('🏆 TOP 3 🏆', 1100, 110);
            
            // Draw rankings
            textAlign(LEFT, TOP);
            textStyle(NORMAL);
            let yPos = 150;
            
            for (let i = 0; i < 3; i++) {
                // Rank color
                let rankColor;
                if (i === 0) rankColor = color(255, 215, 0);      // Gold
                else if (i === 1) rankColor = color(192, 192, 192); // Silver
                else rankColor = color(205, 127, 50);              // Bronze
                
                // Rank
                fill(rankColor);
                textSize(18);
                text(['1st', '2nd', '3rd'][i], 1035, yPos);
                
                // Score
                fill(255);
                textSize(24);
                if (i < rankings.length) {
                    text(rankings[i], 1080, yPos - 2);
                } else {
                    fill(100);
                    text('---', 1080, yPos - 2);
                }
                
                yPos += 50;
            }
            
            pop();
        }
        
        // Mouse click handling
        function mousePressed() {
            if (gameOver) {
                // Button position and size
                let buttonX = 600;
                let buttonY = height/2 + 140;
                let buttonW = 200;
                let buttonH = 50;
                
                // Check whether the button was clicked
                if (mouseX > buttonX - buttonW/2 && mouseX < buttonX + buttonW/2 &&
                    mouseY > buttonY - buttonH/2 && mouseY < buttonY + buttonH/2) {
                    resetGame();
                }
            }
        }
        
        // Responsive handling (on window resize)
        function windowResized() {
            // Scale down on small screens
            let canvasWidth = min(windowWidth - 20, 1200);
            let canvasHeight = (canvasWidth / 1200) * 600;
            resizeCanvas(canvasWidth, canvasHeight);
            
            // Adjust player position
            if (player) {
                player.x = constrain(player.x, player.width/2, width - player.width/2);
                player.y = height - 50;
            }
        }
    </script>
</body>
</html>
